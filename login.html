<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Log In | Behind The Sound</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="auth.css">
</head>

<body>

  <main class="auth-page">


    <section class="auth-card">

      <a href="index.html" class="auth-logo">
        BEHIND <span>THE SOUND</span>
      </a>

      <div class="auth-heading">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Log In</h1>
        <p class="subtitle">
          Continue your journey into the world of sound.
        </p>
      </div>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="password">Password</label>

            <button
              type="button"
              id="forgotPassword"
              class="text-button"
            >
              Forgot password?
            </button>
          </div>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <p id="formMessage" class="form-message"></p>

        <button type="submit" class="auth-button">
          Log In
          <span>→</span>
        </button>

      </form>

      <div class="auth-divider">
        <span>OR</span>
      </div>

      <p class="switch-auth">
        Don't have an account?
        <a href="signup.html">Sign Up</a>
      </p>


    </section>

  </main>

  <script type="module" src="auth.js"></script>

</body>
</html>
