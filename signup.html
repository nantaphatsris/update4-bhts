<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign Up | Behind The Sound</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="auth.css">
</head>

<body>

  <main class="auth-page">


    <section class="auth-card signup-card">

      <a href="index.html" class="auth-logo">
        BEHIND <span>THE SOUND</span>
      </a>

      <div class="auth-heading">
        <p class="eyebrow">START YOUR JOURNEY</p>
        <h1>Create Account</h1>
        <p class="subtitle">
          Join us and discover the art behind every sound.
        </p>
      </div>

      <form id="signupForm">

        <div class="form-group">
          <label for="fullName">Full Name</label>

          <input
            type="text"
            id="fullName"
            placeholder="Enter your name"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            placeholder="Create a password (at least 6 characters)"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            autocomplete="new-password"
            required
          >
        </div>

        <p id="formMessage" class="form-message"></p>

        <button type="submit" class="auth-button">
          Create Account
          <span>→</span>
        </button>

      </form>

      <div class="auth-divider">
        <span>OR</span>
      </div>

      <p class="switch-auth">
        Already have an account?
        <a href="login.html">Log In</a>
      </p>


    </section>

  </main>

  <script type="module" src="auth.js"></script>

</body>
</html>
